<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ asunto }}</title>
</head>
<body style="
    margin:0;
    padding:0;
    background-color:#f4f6f9;
    font-family:Arial, Helvetica, sans-serif;
">
    <table width="100%" cellpadding="0" cellspacing="0">
        <tr>
            <td align="center" style="padding:40px 20px;">

                <table width="600" cellpadding="0" cellspacing="0" style="
                    background:#ffffff;
                    border-radius:12px;
                    overflow:hidden;
                    box-shadow:0 4px 15px rgba(0,0,0,0.1);
                ">

                    <!-- Header -->
                    <tr>
                        <td style="
                            background:linear-gradient(135deg,#2563eb,#1d4ed8);
                            color:white;
                            text-align:center;
                            padding:30px;
                        ">
                            <h1 style="margin:0;">📧 Notificación</h1>
                            <p style="margin-top:10px;">
                                {{ asunto }}
                            </p>
                        </td>
                    </tr>

                    <!-- Content -->
                    <tr>
                        <td style="
                            padding:40px;
                            color:#374151;
                            line-height:1.7;
                            font-size:16px;
                        ">
                            {{ mensaje|linebreaks }}
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="
                            background:#f9fafb;
                            text-align:center;
                            padding:20px;
                            color:#6b7280;
                            font-size:13px;
                        ">
                            © {% now "Y" %} Mi Empresa<br>
                            Este correo fue enviado automáticamente.
                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>
</body>
</html>
